<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horse Breeding System - HorseSquare Pakistan</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',sans-serif;
  background:#F8FAFC;
  color:#1E293B;
  line-height:1.6;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#0F172A,#1E293B);
  padding:25px;
  text-align:center;
  color:white;
  border-bottom:3px solid #D4AF37;
}

header h1{
  font-size:2.3rem;
  background:linear-gradient(135deg,#FFFFFF,#D4AF37);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

header p{
  color:#94A3B8;
  margin-top:8px;
}

nav{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
}

nav a{
  color:#CBD5E1;
  text-decoration:none;
  transition:0.3s;
  font-size:14px;
  text-transform:uppercase;
}

nav a:hover{
  color:#D4AF37;
}

/* CONTAINER */

.container{
  max-width:1200px;
  margin:40px auto;
  padding:20px;
}

/* SECTION TITLE */

.section-title{
  font-size:2rem;
  margin-bottom:25px;
  color:#0F172A;
  position:relative;
}

.section-title::after{
  content:'';
  position:absolute;
  left:0;
  bottom:-8px;
  width:70px;
  height:3px;
  background:#D4AF37;
}

/* BREEDING CARDS */

.breeding-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:25px;
}

.breeding-card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #E2E8F0;
  transition:0.4s;
  box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

.breeding-card:hover{
  transform:translateY(-6px);
  border-color:#D4AF37;
  box-shadow:0 20px 40px rgba(0,0,0,0.12);
}

.breeding-card img{
  width:100%;
  height:240px;
  object-fit:cover;
}

.card-content{
  padding:25px;
}

.card-content h3{
  color:#0F172A;
  margin-bottom:12px;
  font-size:1.5rem;
}

.card-content p{
  margin:8px 0;
  color:#64748B;
}

.card-content strong{
  color:#1E293B;
}

/* BREED TAG */

.breed-tag{
  display:inline-block;
  background:linear-gradient(135deg,#D4AF37,#C9A227);
  color:#0F172A;
  padding:7px 15px;
  border-radius:30px;
  font-weight:bold;
  margin-top:10px;
}

/* BUTTONS */

.actions{
  margin-top:20px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.actions a{
  flex:1;
  text-align:center;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
  transition:0.3s;
}

.call-btn{
  background:#F1F5F9;
  color:#0F172A;
  border:1px solid #CBD5E1;
}

.call-btn:hover{
  background:#0F172A;
  color:#D4AF37;
}

.breed-btn{
  background:linear-gradient(135deg,#0F172A,#1E293B);
  color:white;
}

.breed-btn:hover{
  background:linear-gradient(135deg,#1E293B,#334155);
}

/* FORM SECTION */

.form-section{
  margin-top:60px;
  background:white;
  padding:35px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.06);
  border:1px solid #E2E8F0;
}

form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

form input,
form select,
form textarea{
  padding:14px;
  border:1.5px solid #CBD5E1;
  border-radius:10px;
  background:#F8FAFC;
  font-size:15px;
}

form textarea{
  grid-column:span 2;
  resize:none;
}

form input:focus,
form select:focus,
form textarea:focus{
  outline:none;
  border-color:#D4AF37;
}

.submit-btn{
  grid-column:span 2;
  background:linear-gradient(135deg,#0F172A,#1E293B);
  color:white;
  border:none;
  padding:16px;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  font-weight:700;
  transition:0.3s;
}

.submit-btn:hover{
  background:linear-gradient(135deg,#1E293B,#334155);
}

/* FOOTER */

footer{
  background:#0F172A;
  color:#94A3B8;
  text-align:center;
  padding:25px;
  margin-top:60px;
  border-top:3px solid #D4AF37;
}

@media(max-width:768px){

  form{
    grid-template-columns:1fr;
  }

  .submit-btn,
  form textarea{
    grid-column:span 1;
  }

}

</style>
</head>

<body>

<header>

<h1>HorseSquare Pakistan</h1>

<p>Professional Horse Breeding System</p>

<nav>
<a href="index.html">Home</a>
<a href="breeding-system.html">Breeding</a>
<a href="sell.html">Sell Horse</a>
<a href="contact.html">Contact</a>
</nav>

</header>

<div class="container">

<h2 class="section-title">
Available Breeding Horses
</h2>

<div class="breeding-grid" id="breedingGrid">

<p style="text-align:center;color:#64748B;padding:30px;">Loading breeding horses...</p>

</div>

<!-- FORM -->

<div class="form-section" id="apply">

<h2 class="section-title">
Apply for Horse Breeding
</h2>

<div id="breedingMessage" style="display:none;padding:12px 15px;border-radius:8px;margin-bottom:18px;font-size:14px;"></div>

<form id="breedingForm">

<input type="text"
id="requesterName"
placeholder="Your Name"
required>

<input type="tel"
id="requesterPhone"
placeholder="Phone Number"
required>

<input type="text"
id="ownHorseName"
placeholder="Your Horse Name"
required>

<select id="preferredBreed" required>

<option value="">
Select Preferred Breed
</option>

<option>Arabian</option>
<option>Thoroughbred</option>
<option>Spanish</option>
<option>Desi</option>

</select>

<textarea rows="5"
id="breedingDetails"
placeholder="Describe your horse details and breeding requirements..."></textarea>

<button class="submit-btn"
type="submit"
id="submitBreedingBtn">

Submit Breeding Request

</button>

</form>

</div>

</div>

<footer>

<p>
© 2026 HorseSquare Pakistan | Horse Breeding System
</p>

</footer>

<script>

const API_BASE = "http://localhost:5000/api"; // change this if your backend runs elsewhere

function escapeHtml(str){
  if(str === undefined || str === null) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function loadBreedingHorses(){
  const grid = document.getElementById("breedingGrid");

  try {
    const res = await fetch(`${API_BASE}/breeding/horses`);
    const data = await res.json();

    if(!data.success || data.data.length === 0){
      grid.innerHTML = '<p style="text-align:center;color:#64748B;padding:30px;">No breeding horses available right now.</p>';
      return;
    }

    grid.innerHTML = data.data.map(function(h){
      const imgSrc = h.image
        ? (h.image.startsWith("/uploads") ? API_BASE.replace("/api","") + h.image : h.image)
        : "https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=900";

      return `
        <div class="breeding-card">
          <img src="${imgSrc}" alt="Horse">
          <div class="card-content">
            <h3>${escapeHtml(h.name)}</h3>
            <p><strong>Breed:</strong> ${escapeHtml(h.breed)}</p>
            <p><strong>Age:</strong> ${escapeHtml(h.age)} Years</p>
            <p><strong>Location:</strong> ${escapeHtml(h.location)}</p>
            <p><strong>Owner:</strong> ${escapeHtml(h.ownerName)}</p>
            <p><strong>Breeding Fee:</strong> ₨ ${Number(h.breedingFee).toLocaleString()}</p>
            ${h.tag ? `<div class="breed-tag">${escapeHtml(h.tag)}</div>` : ""}
            <div class="actions">
              <a href="tel:+923001234567" class="call-btn">📞 Call</a>
              <a href="#apply" class="breed-btn" onclick="selectBreedingHorse('${h._id}', '${escapeHtml(h.name)}')">🐎 Request Breeding</a>
            </div>
          </div>
        </div>`;
    }).join("");

  } catch(err){
    grid.innerHTML = '<p style="text-align:center;color:#DC2626;padding:30px;">Could not reach the server. Make sure the backend is running.</p>';
  }
}

let selectedBreedingHorseId = null;

function selectBreedingHorse(id, name){
  selectedBreedingHorseId = id;
  // pre-fill a note in the details box so the user knows which horse they're requesting
  const details = document.getElementById("breedingDetails");
  if(!details.value){
    details.value = "Interested in breeding with: " + name;
  }
}

const breedingForm = document.getElementById("breedingForm");
const breedingMessage = document.getElementById("breedingMessage");
const submitBreedingBtn = document.getElementById("submitBreedingBtn");

function showBreedingMessage(text, type){
  breedingMessage.style.display = "block";
  breedingMessage.textContent = text;
  if(type === "error"){
    breedingMessage.style.background = "#FEE2E2";
    breedingMessage.style.color = "#991B1B";
  } else {
    breedingMessage.style.background = "#DCFCE7";
    breedingMessage.style.color = "#166534";
  }
}

breedingForm.addEventListener("submit", async function(event){

  event.preventDefault();

  const payload = {
    requesterName: document.getElementById("requesterName").value.trim(),
    phone: document.getElementById("requesterPhone").value.trim(),
    ownHorseName: document.getElementById("ownHorseName").value.trim(),
    preferredBreed: document.getElementById("preferredBreed").value,
    details: document.getElementById("breedingDetails").value.trim(),
    breedingHorseId: selectedBreedingHorseId || undefined,
  };

  submitBreedingBtn.disabled = true;
  submitBreedingBtn.textContent = "Submitting...";

  try {
    const res = await fetch(`${API_BASE}/breeding/requests`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    const data = await res.json();

    if(!data.success){
      showBreedingMessage(data.message || "Could not submit your request.", "error");
      submitBreedingBtn.disabled = false;
      submitBreedingBtn.textContent = "Submit Breeding Request";
      return;
    }

    showBreedingMessage("Your breeding request has been submitted successfully!", "success");
    breedingForm.reset();
    selectedBreedingHorseId = null;

  } catch(err){
    showBreedingMessage("Could not reach the server. Make sure the backend is running.", "error");
  }

  submitBreedingBtn.disabled = false;
  submitBreedingBtn.textContent = "Submit Breeding Request";

});

loadBreedingHorses();

</script>

</body>
</html>
