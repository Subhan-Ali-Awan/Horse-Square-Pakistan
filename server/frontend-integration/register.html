<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - HorseSquare Pakistan</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0F172A,#1E293B);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* REGISTER CARD */

.register-card{
    width:100%;
    max-width:650px;
    background:#FFFFFF;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #E2E8F0;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
    animation:fadeUp 0.8s ease;
}

.register-card::before{
    content:'';
    display:block;
    height:5px;
    background:linear-gradient(
        90deg,
        #D4AF37,
        #C9A227,
        #D4AF37
    );
}

/* HEADER */

.register-header{
    background:linear-gradient(
        135deg,
        #0F172A,
        #1E293B
    );
    padding:35px;
    text-align:center;
}

.register-header h1{
    color:white;
    font-size:2rem;
}

.register-header span{
    color:#D4AF37;
}

.register-header p{
    color:#CBD5E1;
    margin-top:8px;
}

/* BODY */

.register-body{
    padding:35px;
}

/* GRID */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    margin-bottom:8px;
    font-weight:600;
    color:#1E293B;
}

.form-group input,
.form-group select{
    padding:14px;
    border:1.5px solid #CBD5E1;
    border-radius:10px;
    background:#F8FAFC;
    font-size:15px;
    transition:0.3s;
}

.form-group input:focus,
.form-group select:focus{
    outline:none;
    border-color:#D4AF37;
    box-shadow:0 0 0 4px rgba(212,175,55,0.15);
    background:white;
}

/* FULL WIDTH */

.full-width{
    grid-column:span 2;
}

/* BUTTON */

.register-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:linear-gradient(
        135deg,
        #0F172A,
        #1E293B
    );
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
    margin-top:25px;
}

.register-btn:hover{
    transform:translateY(-2px);
    background:linear-gradient(
        135deg,
        #1E293B,
        #334155
    );
}

/* LOGIN LINK */

.login-link{
    text-align:center;
    margin-top:20px;
    color:#64748B;
}

.login-link a{
    color:#D4AF37;
    text-decoration:none;
    font-weight:700;
}

.login-link a:hover{
    text-decoration:underline;
}

/* ANIMATION */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */

@media(max-width:768px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full-width{
        grid-column:span 1;
    }

    .register-body{
        padding:25px;
    }

}

</style>
</head>

<body>

<div class="register-card">

<div class="register-header">
    <h1>Horse<span>-Square</span> Pakistan</h1>
    <p>Create Your Account</p>
</div>

<div class="register-body">

<div id="registerMessage" style="display:none;padding:12px 15px;border-radius:8px;margin-bottom:18px;font-size:14px;"></div>

<form id="registerForm">

<div class="form-grid">

<div class="form-group">
<label>First Name</label>
<input type="text" id="firstName" required>
</div>

<div class="form-group">
<label>Last Name</label>
<input type="text" id="lastName" required>
</div>

<div class="form-group full-width">
<label>Email Address</label>
<input type="email" id="email" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="tel" id="phone" placeholder="+92 300 1234567" required>
</div>
<div class="form-group">
<label>City</label>
<select id="city" required>
<option value="">Select City</option>
<option>Lahore</option>
<option>Islamabad</option>
<option>Karachi</option>
<option>Rawalpindi</option>
<option>Faisalabad</option>
<option>Multan</option>
</select>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" required minlength="6">
</div>

<div class="form-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" required minlength="6">
</div>

<div class="form-group full-width">
<label>User Type</label>
<select id="userType" required>
<option value="">Select User Type</option>
<option>Horse Buyer</option>
<option>User</option>
<option>Breeder</option>
<option>Riding Student</option>
</select>
</div>

</div>

<button type="submit" class="register-btn" id="registerBtn">
Create Account
</button>

</form>

<div class="login-link">
Already have an account?
<a href="login.html">Login Here</a>
</div>

</div>

</div>
<script>

const API_BASE = "http://localhost:5000/api"; // change this if your backend runs elsewhere

const registerForm = document.getElementById("registerForm");
const registerMessage = document.getElementById("registerMessage");
const registerBtn = document.getElementById("registerBtn");

function showRegisterMessage(text, type) {
    registerMessage.style.display = "block";
    registerMessage.textContent = text;
    if (type === "error") {
        registerMessage.style.background = "#FEE2E2";
        registerMessage.style.color = "#991B1B";
    } else {
        registerMessage.style.background = "#DCFCE7";
        registerMessage.style.color = "#166534";
    }
}

registerForm.addEventListener("submit", async function (e) {
    e.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        showRegisterMessage("Passwords do not match.", "error");
        return;
    }

    const payload = {
        firstName: document.getElementById("firstName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        city: document.getElementById("city").value,
        password: password,
        confirmPassword: confirmPassword,
        userType: document.getElementById("userType").value,
    };

    registerBtn.disabled = true;
    registerBtn.textContent = "Creating Account...";

    try {
        const res = await fetch(`${API_BASE}/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (!data.success) {
            showRegisterMessage(data.message || "Registration failed.", "error");
            registerBtn.disabled = false;
            registerBtn.textContent = "Create Account";
            return;
        }

        // Auto-login: save the token returned by registration
        localStorage.setItem("hs_token", data.token);
        localStorage.setItem("hs_user", JSON.stringify(data.user));

        showRegisterMessage("Account created successfully! Redirecting...", "success");

        setTimeout(() => {
            window.location.href = "index.html";
        }, 900);
    } catch (err) {
        showRegisterMessage("Could not reach the server. Make sure the backend is running.", "error");
        registerBtn.disabled = false;
        registerBtn.textContent = "Create Account";
    }
});

</script>
</body>
</html>
