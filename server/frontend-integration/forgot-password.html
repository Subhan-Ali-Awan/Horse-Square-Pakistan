<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password - Horse-Square Pakistan</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0F172A,#1E293B);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* CARD */

.forgot-card{
    width:100%;
    max-width:450px;
    background:#FFFFFF;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
    border:1px solid #E2E8F0;
    animation:fadeUp 0.8s ease;
}

/* GOLD BORDER */

.forgot-card::before{
    content:'';
    display:block;
    height:5px;
    background:linear-gradient(
        90deg,
        #D4AF37,
        #C9A227,
        #D4AF37
    );
}

/* HEADER */

.forgot-header{
    background:linear-gradient(
        135deg,
        #0F172A,
        #1E293B
    );
    padding:25px;
    text-align:center;
}

.forgot-header h1{
    color:#FFFFFF;
    font-size:1.2rem;
    margin-bottom:8px;
}

.forgot-header span{
    color:#D4AF37;
}

.forgot-header p{
    color:#CBD5E1;
    font-size:14px;
    line-height:1.6;
}

/* BODY */

.forgot-body{
    padding:35px;
}

.lock-icon{
    text-align:center;
    font-size:55px;
    margin-bottom:20px;
}

.info-text{
    text-align:center;
    color:#64748B;
    font-size:14px;
    margin-bottom:25px;
    line-height:1.6;
}

/* FORM */

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#1E293B;
}

.form-group input{
    width:100%;
    padding:14px;
    border:1.5px solid #CBD5E1;
    border-radius:10px;
    background:#F8FAFC;
    font-size:15px;
    transition:0.3s;
}

.form-group input:focus{
    outline:none;
    border-color:#D4AF37;
    box-shadow:0 0 0 4px rgba(212,175,55,0.15);
    background:white;
}

/* BUTTON */

.reset-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(
        135deg,
        #0F172A,
        #1E293B
    );
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 4px 15px rgba(15,23,42,0.3);
}

.reset-btn:hover{
    transform:translateY(-2px);
    background:linear-gradient(
        135deg,
        #1E293B,
        #334155
    );
}

.reset-btn:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

/* TIMER */

.timer-box{
    text-align:center;
    margin-top:15px;
    color:#64748B;
    font-size:14px;
    display:none;
    line-height:1.7;
}

.timer-box span{
    color:#D4AF37;
    font-weight:700;
}

/* BACK LINK */

.back-login{
    text-align:center;
    margin-top:25px;
}

.back-login a{
    text-decoration:none;
    color:#D4AF37;
    font-weight:700;
}

.back-login a:hover{
    text-decoration:underline;
}

/* ANIMATION */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */

@media(max-width:500px){

    .forgot-body{
        padding:25px;
    }

}

</style>

</head>
<body>

<div class="forgot-card">

    <div class="forgot-header">
        <h1>Horse<span>-Square</span> Pakistan</h1>
        <p>Recover Your Account Password</p>
    </div>

    <div class="forgot-body">

        <div class="lock-icon">
            🔐
        </div>

        <div class="info-text">
            Enter your registered email address below.
            We will send you a password reset code.
        </div>

        <div id="resetMessage" style="display:none;padding:12px 15px;border-radius:8px;margin-bottom:18px;font-size:14px;"></div>

        <form id="resetForm">

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >
            </div>

            <button type="submit" class="reset-btn" id="resetBtn">
                Send Reset Code
            </button>

            <div class="timer-box" id="timerBox">
                Reset code sent successfully.<br>
                Resend code available in
                <span id="countdown">60</span>
                seconds
            </div>

        </form>

        <!-- Shown after a code has been sent: enter the code + choose a new password -->
        <form id="verifyForm" style="display:none;margin-top:20px;">

            <div class="form-group">
                <label>Reset Code</label>
                <input type="text" id="resetCode" placeholder="Enter the 6-digit code" required maxlength="6">
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6">
            </div>

            <button type="submit" class="reset-btn" id="verifyBtn">
                Reset Password
            </button>

        </form>

        <div class="back-login">
            <a href="login.html">
                ← Back to Login
            </a>
        </div>

    </div>

</div>

<script>

const form = document.getElementById("resetForm");
const button = document.getElementById("resetBtn");
const timerBox = document.getElementById("timerBox");
const countdown = document.getElementById("countdown");
const resetMessage = document.getElementById("resetMessage");
const verifyForm = document.getElementById("verifyForm");
const verifyBtn = document.getElementById("verifyBtn");

const API_BASE = "http://localhost:5000/api"; // change this if your backend runs elsewhere

let timerRunning = false;
let registeredEmail = "";

function showResetMessage(text, type){
    resetMessage.style.display = "block";
    resetMessage.textContent = text;
    if(type === "error"){
        resetMessage.style.background = "#FEE2E2";
        resetMessage.style.color = "#991B1B";
    } else {
        resetMessage.style.background = "#DCFCE7";
        resetMessage.style.color = "#166534";
    }
}

form.addEventListener("submit", async function(e){

    e.preventDefault();

    if(timerRunning){
        return;
    }

    registeredEmail = document.getElementById("email").value.trim();

    button.disabled = true;
    button.innerHTML = "Sending...";

    try {
        const res = await fetch(`${API_BASE}/auth/forgot-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: registeredEmail }),
        });

        const data = await res.json();

        if(!data.success){
            showResetMessage(data.message || "Could not send reset code.", "error");
            button.disabled = false;
            button.innerHTML = "Send Reset Code";
            return;
        }

        showResetMessage("Reset code sent successfully. Check your email.", "success");
        verifyForm.style.display = "block";

    } catch(err){
        showResetMessage("Could not reach the server. Make sure the backend is running.", "error");
        button.disabled = false;
        button.innerHTML = "Send Reset Code";
        return;
    }

    let seconds = 60;
    timerRunning = true;

    button.disabled = true;
    button.innerHTML = "Code Sent";

    timerBox.style.display = "block";
    countdown.innerHTML = seconds;

    const timer = setInterval(function(){

        seconds--;

        countdown.innerHTML = seconds;

        if(seconds <= 0){

            clearInterval(timer);

            timerRunning = false;

            button.disabled = false;
            button.innerHTML = "Resend Reset Code";

            timerBox.innerHTML =
            '<span style="color:#16A34A;font-weight:600;">✓ You can now resend the reset code.</span>';

        }

    },1000);

});

// ---- Step 2: verify code + set new password ----
verifyForm.addEventListener("submit", async function(e){

    e.preventDefault();

    const code = document.getElementById("resetCode").value.trim();
    const newPassword = document.getElementById("newPassword").value;

    verifyBtn.disabled = true;
    verifyBtn.innerHTML = "Resetting...";

    try {
        const res = await fetch(`${API_BASE}/auth/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: registeredEmail, code, newPassword }),
        });

        const data = await res.json();

        if(!data.success){
            showResetMessage(data.message || "Could not reset password.", "error");
            verifyBtn.disabled = false;
            verifyBtn.innerHTML = "Reset Password";
            return;
        }

        showResetMessage("Password reset successfully! Redirecting to login...", "success");

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1200);

    } catch(err){
        showResetMessage("Could not reach the server. Make sure the backend is running.", "error");
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = "Reset Password";
    }

});

</script>

</body>
</html>
